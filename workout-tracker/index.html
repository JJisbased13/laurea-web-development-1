<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Weekly Workout Tracker</title><link rel="stylesheet" href="style.css"></head>
<body><main class="container"><header><p class="eyebrow">TRAINING JOURNAL</p><h1>Weekly Workout Tracker</h1><p class="muted">Log your sessions. See where your training time goes.</p></header><section class="stats" aria-label="Weekly totals"><article><span>Total hours</span><strong id="totalHours">0</strong></article><article><span>Sessions</span><strong id="sessionCount">0</strong></article><article><span>Top category</span><strong id="topCategory">—</strong></article></section><div class="columns"><section class="panel"><h2>Add a workout</h2><form id="workoutForm" novalidate><label for="activity">Activity description</label><input id="activity" maxlength="80" placeholder="e.g. Leg day" required><small class="error" id="activityError"></small><label for="category">Category</label><select id="category"><option value="">Select a category</option><option>Strength</option><option>Running</option><option>Rugby</option><option>Football</option><option>Recovery</option><option>Other</option></select><small class="error" id="categoryError"></small><label for="day">Day</label><select id="day"><option value="">Select a day</option><option>Monday</option><option>Tuesday</option><option>Wednesday</option><option>Thursday</option><option>Friday</option><option>Saturday</option><option>Sunday</option></select><small class="error" id="dayError"></small><label for="hours">Duration (hours)</label><input id="hours" type="number" min="0.25" max="24" step="0.25" placeholder="e.g. 1.5" required><small class="error" id="hoursError"></small><button type="submit">+ Add workout</button></form></section><section class="panel"><h2>Hours by category</h2><div id="chart" class="chart"><p class="muted">Add a workout to see your breakdown.</p></div></section></div><section class="panel history"><div class="heading-row"><h2>Workout history</h2><button class="secondary" id="clearAll" type="button">Clear all</button></div><div id="workoutList" aria-live="polite"><p class="muted">No workouts logged yet.</p></div></section><footer>Saved locally in this browser · Native JavaScript</footer></main><script src="script.js"></script></body></html>
